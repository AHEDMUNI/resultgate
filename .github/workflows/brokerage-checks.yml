name: Brokerage checks (internal, no payments)
on:
  push:
    branches: [feature/agent-brokerage]
    paths:
      - 'resultgate/**'
      - 'tests/**'
      - 'scripts/brokerage_acceptance.py'
      - 'scripts/delegation_acceptance.py'
      - 'scripts/network_acceptance.py'
      - '.github/workflows/brokerage-checks.yml'
  pull_request:
    paths:
      - 'resultgate/**'
      - 'tests/**'
permissions:
  contents: read
concurrency:
  group: brokerage-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install tested dependencies
        run: python -m pip install -r requirements-tested.txt
      - name: All local tests, no live provider calls
        run: python -m unittest discover -s tests
      - name: Two explicit public DOI calls (internal integration, never adoption)
        if: github.event_name == 'push' && github.repository == 'AHEDMUNI/resultgate'
        run: python scripts/brokerage_acceptance.py --live
      - name: One free specialist demo task (internal integration only)
        if: github.event_name == 'push' && github.repository == 'AHEDMUNI/resultgate'
        run: python scripts/delegation_acceptance.py --live
      - name: Build and install into a separate environment
        run: |
          python -m pip wheel --no-deps . -w /tmp/resultgate-wheel
          python -m venv /tmp/resultgate-client
          /tmp/resultgate-client/bin/python -m pip install /tmp/resultgate-wheel/*.whl
          /tmp/resultgate-client/bin/python -I scripts/acceptance.py
          /tmp/resultgate-client/bin/python -I scripts/brokerage_installed_acceptance.py
          /tmp/resultgate-client/bin/python -I scripts/delegation_installed_acceptance.py
          /tmp/resultgate-client/bin/python -I scripts/network_acceptance.py --offline
      - name: New installed client discovers and delegates (internal only)
        if: github.event_name == 'push' && github.repository == 'AHEDMUNI/resultgate'
        run: /tmp/resultgate-client/bin/python -I scripts/network_acceptance.py --live
