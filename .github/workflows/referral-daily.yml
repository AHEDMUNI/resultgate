name: Referral daily availability and measurement gaps
on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/referral-daily.yml'
      - 'resultgate/referral_daily.py'
      - 'scripts/referral_daily_status.py'
permissions:
  contents: read
concurrency:
  group: referral-daily
  cancel-in-progress: false
jobs:
  report:
    if: vars.RESULTGATE_REFERRAL_MONITOR_DISABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check 'pydantic==2.14.1'
      - run: python scripts/referral_daily_status.py > referral-daily.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: referral-daily
          path: referral-daily.json
          retention-days: 30
