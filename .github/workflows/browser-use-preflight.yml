name: Browser Use existing trial cleanup only
on:
  push:
    branches: [trial/browser-use-preflight]
permissions:
  contents: read
concurrency:
  group: browser-use-read-only-preflight
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'AHEDMUNI/resultgate'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Stop and reconcile existing task only
        env:
          BROWSER_USE_API_KEY: ${{ secrets.BROWSER_USE_API_KEY }}
        run: |
          python - <<'PY'
          import json, os
          from resultgate.delegation.browser_use_trial import Transport, TrialError, stop_session_browsers, amount
          SID='f148cb66-d9ad-4718-8c6a-df41e552b858'
          RID='c73bb06a-6d66-407a-99a1-c949ad519932'
          class CleanupOnly(Transport):
              def request(self, method, path, payload=None, **kwargs):
                  if method not in ('GET', 'PATCH') or (method == 'PATCH' and payload != {'action':'stop'}):
                      raise TrialError('cleanup_only')
                  return super().request(method,path,payload,**kwargs)
          t=CleanupOnly(os.environ.get('BROWSER_USE_API_KEY'))
          try:
              stopped=stop_session_browsers(t,SID)
              cost=t.request('GET','/api/v4/sessions/'+SID+'/cost')
              run=t.request('GET','/api/v4/runs/'+RID)
              account=t.request('GET','/api/v2/billing/account')
              if cost.get('sessionId')!=SID or run.get('id')!=RID or run.get('sessionId')!=SID:
                  raise TrialError('binding_failed')
              out={'run_id':RID,'session_id':SID,'browser_stopped':stopped,'new_tasks_submitted':0,
                   'state':run.get('status'),'session_run_count':cost.get('numRuns'),
                   'credits_remaining_usd':amount(account.get('totalCreditsBalanceUsd')),
                   'active_sessions':account.get('activeSessionCount')}
              for field in ('llmCostUsd','searchCostUsd','browserCostUsd','proxyCostUsd','totalCostUsd'):
                  out[field]=amount(cost.get(field))
              print('RESULTGATE_CLEANUP='+json.dumps(out,sort_keys=True))
          except TrialError as error:
              print('RESULTGATE_CLEANUP='+json.dumps({'error':str(error),'new_tasks_submitted':0}))
              raise SystemExit(1) from None
          PY
