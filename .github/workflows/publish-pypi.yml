name: Build and publish to PyPI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-pypi.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the validated 0.2.0 release to PyPI (requires configured Trusted Publisher)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'AHEDMUNI/resultgate' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install build and test dependencies
        run: |
          python -m pip install build twine
          python -m pip install -r requirements-tested.txt
          python -m pip install --no-deps -e .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Validate release identity
        run: |
          python - <<'PY'
          import pathlib, tomllib, json
          p = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']
          assert p['name'] == 'resultgate-pilot'
          assert p['version'] == '0.2.0'
          assert p['license'] == 'MIT'
          assert pathlib.Path('LICENSE').is_file()
          assert '<!-- mcp-name: io.github.AHEDMUNI/resultgate -->' in pathlib.Path('README.md').read_text()
          assert json.loads(pathlib.Path('server.json').read_text())['version'] == p['version']
          PY
      - name: Build wheel and source distribution
        run: |
          python -m build
          python -m twine check --strict dist/*
      - name: Clean wheel installation and MCP acceptance
        run: |
          python -m venv "${RUNNER_TEMP}/resultgate-test"
          "${RUNNER_TEMP}/resultgate-test/bin/python" -m pip install dist/*.whl
          "${RUNNER_TEMP}/resultgate-test/bin/python" -I scripts/acceptance.py
          "${RUNNER_TEMP}/resultgate-test/bin/python" -I -m resultgate.pilot_client --offline
          "${RUNNER_TEMP}/resultgate-test/bin/python" -m pip check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pypi-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/resultgate-pilot/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pypi-distributions
          path: dist/
      - name: Publish using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          attestations: true
