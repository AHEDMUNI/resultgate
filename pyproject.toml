[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "resultgate-pilot"
version = "0.2.0"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
description = "Local evidence checks, provider discovery and consented agent task delegation"
requires-python = ">=3.11"
dependencies = ["defusedxml==0.7.1", "mcp==1.30.0", "uvicorn==0.38.0", "starlette==1.9.0", "pydantic==2.14.1"]

[project.urls]
Repository = "https://github.com/AHEDMUNI/resultgate"
Issues = "https://github.com/AHEDMUNI/resultgate/issues"

[project.optional-dependencies]
test = ["jsonschema==4.25.1"]

[project.scripts]
resultgate = "resultgate.server:main"
resultgate-pilot = "resultgate.server:main"

[tool.setuptools.packages.find]
include = ["resultgate*"]

[tool.setuptools.package-data]
resultgate = ["referral_catalog.json"]
